name: Apply Final ERRC Repair

on:
  push:
    branches:
      - agent/errc-modernize-features
    paths:
      - .github/patches/uvmgr-final.patch
      - .github/workflows/apply-errc-final.yml

permissions:
  contents: write

jobs:
  apply-validate-publish:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('.github/patches/uvmgr-final.patch')
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = '19d130f19bc73f7e0488517de0b06c52a7231a1ef66afb18d1bba258c4fceb94'
          if actual != expected:
              raise SystemExit(f'patch identity mismatch: {actual}')
          PY
          git apply --check .github/patches/uvmgr-final.patch
          git apply .github/patches/uvmgr-final.patch
          git diff --check

      - name: Install declared lock closure
        run: uv sync --all-extras --group dev --group ci

      - name: Compile repaired surfaces
        run: |
          uv run python -m compileall -q \
            src/uvmgr/commands/__init__.py \
            src/uvmgr/commands/automation.py \
            src/uvmgr/commands/performance.py \
            src/uvmgr/commands/security.py \
            src/uvmgr/core/capabilities.py \
            src/uvmgr/ops/tests.py \
            tests/test_tests_execution.py

      - name: Check fatal Python diagnostics
        run: |
          uv run ruff check --select F,E9 \
            src/uvmgr/commands/__init__.py \
            src/uvmgr/commands/automation.py \
            src/uvmgr/commands/performance.py \
            src/uvmgr/commands/security.py \
            src/uvmgr/core/capabilities.py \
            src/uvmgr/ops/tests.py \
            tests/test_tests_execution.py

      - name: Execute receipt and command-construction tests
        run: uv run pytest tests/test_tests_execution.py -v --tb=short

      - name: Replay formerly failing dogfood invocation
        run: uv run uvmgr tests run tests/test_tests_execution.py -v --tb=short --no-parallel --no-coverage

      - name: Verify CLI and admitted capability construction
        run: |
          uv run uvmgr --version
          uv run uvmgr --help >/dev/null
          uv run uvmgr capabilities verify

      - name: Commit validated repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patches/uvmgr-final.patch .github/workflows/apply-errc-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/uvmgr/commands/__init__.py \
            src/uvmgr/commands/automation.py \
            src/uvmgr/commands/performance.py \
            src/uvmgr/commands/security.py \
            src/uvmgr/core/capabilities.py \
            src/uvmgr/ops/tests.py \
            tests/test_tests_execution.py
          git add -u .github/patches/uvmgr-final.patch .github/workflows/apply-errc-final.yml
          git diff --cached --check
          git commit -m 'fix: finish admitted capability construction'
          git push origin HEAD:agent/errc-modernize-features
