name: CI

# Canonical reversible validation rail; publication authority lives in Release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.13"
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate admitted source
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Admit exact lock closure
        run: uv sync --frozen --all-extras --group dev --group ci

      - name: Validate lock
        run: uv lock --check

      - name: Compile admitted source
        run: uv run python -m compileall -q src/uvmgr

      - name: Verify enterprise repository contract
        run: uv run python -m uvmgr.core.enterprise_contract

      - name: Lint repaired and governance boundaries without mutation
        run: |
          uv run ruff check --no-fix \
            src/uvmgr/cli.py \
            src/uvmgr/commands/__init__.py \
            src/uvmgr/commands/build.py \
            src/uvmgr/commands/tests.py \
            src/uvmgr/commands/capabilities.py \
            src/uvmgr/core/capabilities.py \
            src/uvmgr/core/command_registry.py \
            src/uvmgr/core/command_repairs.py \
            src/uvmgr/core/enterprise_contract.py \
            src/uvmgr/ops/tests.py \
            src/uvmgr/runtime/build.py \
            src/uvmgr/runtime/tests.py \
            tests/test_build_exe.py \
            tests/test_command_repairs.py \
            tests/test_enterprise_contract.py \
            tests/test_tests_execution.py

      - name: Execute admitted behavioral boundary
        run: |
          uv run pytest \
            tests/test_command_repairs.py \
            tests/test_tests_execution.py \
            tests/test_cli.py \
            tests/test_import.py \
            tests/test_build_exe.py \
            tests/test_enterprise_contract.py \
            -v --tb=short

      - name: Replay uvmgr test boundary
        run: >-
          uv run uvmgr tests run
          tests/test_command_repairs.py
          tests/test_tests_execution.py
          -v --tb=short --no-parallel --no-coverage

      - name: Verify capability admission fence
        run: |
          uv run uvmgr capabilities verify
          uv run python - <<'PY'
          from uvmgr.commands import EXCLUDED_COMMANDS
          assert "agent" in EXCLUDED_COMMANDS
          assert "spiff_otel" in EXCLUDED_COMMANDS
          PY

      - name: Manufacture validation receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          mkdir -p receipts reports/receipts
          git archive --format=tar.gz --prefix=uvmgr/ --output=uvmgr-source.tar.gz HEAD
          sha256sum uvmgr-source.tar.gz | tee receipts/source-capsule.sha256
          git rev-parse HEAD | tee receipts/head.sha
          git rev-parse HEAD^{tree} | tee receipts/tree.sha
          printf '%s\n' "${SUBJECT_SHA}" | tee receipts/subject.sha
          find reports/receipts -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | tee receipts/execution-receipts.sha256

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-validation-${{ env.SUBJECT_SHA }}
          path: |
            uvmgr-source.tar.gz
            receipts/
            reports/receipts/
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13.14"]
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Admit compatibility closure
        run: uv sync --frozen --all-extras --group dev --group ci

      - name: Compile compatibility subject
        run: uv run python -m compileall -q src/uvmgr

      - name: Execute compatibility smoke
        run: >-
          uv run pytest
          tests/test_import.py
          tests/test_cli.py
          tests/test_enterprise_contract.py
          -v --tb=short

  container:
    name: Hardened container
    if: github.event_name != 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"

      - name: Build runtime image without publishing
        run: docker build --target app --tag "uvmgr-ci:${SUBJECT_SHA}" .

      - name: Execute runtime image
        run: |
          set -euo pipefail
          docker run --rm "uvmgr-ci:${SUBJECT_SHA}" --version
          docker run --rm "uvmgr-ci:${SUBJECT_SHA}" --help >/dev/null

      - name: Verify runtime privilege and toolchain boundary
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "uvmgr-ci:${SUBJECT_SHA}" -c 'test "$(id -u)" = "10001"'
          docker run --rm --entrypoint sh "uvmgr-ci:${SUBJECT_SHA}" -c '! command -v sudo'
          docker run --rm --entrypoint sh "uvmgr-ci:${SUBJECT_SHA}" -c '! command -v gcc'
          docker run --rm --entrypoint sh "uvmgr-ci:${SUBJECT_SHA}" -c '! command -v g++'

  executable:
    name: Dogfood executable
    if: github.event_name != 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Admit build closure
        run: uv sync --frozen --all-extras --group dev

      - name: Verify PyInstaller boundary
        run: uv run pytest tests/test_build_exe.py -v --tb=short

      - name: Build and self-test executable
        run: uv run uvmgr build dogfood --test --no-platform

      - name: Execute manufactured binary
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find dist -maxdepth 1 -type f -name 'uvmgr*' -perm -111 -print -quit)"
          test -n "$executable"
          "$executable" --version
          "$executable" --help >/dev/null

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvmgr-dogfood-${{ env.SUBJECT_SHA }}
          path: dist/
          if-no-files-found: error

  security:
    name: Dependency audit
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Admit audit closure
        run: uv sync --frozen --group ci

      - name: Audit locked dependencies
        run: uv run pip-audit
