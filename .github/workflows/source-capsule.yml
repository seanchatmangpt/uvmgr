name: ERRC Validation Capsule

on:
  push:
    branches:
      - agent/errc-modernize-features
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-capsule-macos:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Manufacture exact-head source capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          git archive --format=tar.gz --prefix=uvmgr/ --output=uvmgr-source.tar.gz HEAD
          shasum -a 256 uvmgr-source.tar.gz | tee receipts/source-capsule.sha256
          git rev-parse HEAD | tee receipts/head.sha
          git rev-parse HEAD^{tree} | tee receipts/tree.sha

      - uses: actions/upload-artifact@v6
        with:
          name: uvmgr-source-capsule-macos
          path: |
            uvmgr-source.tar.gz
            receipts/
          if-no-files-found: error
          retention-days: 3

  source-capsule-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Manufacture exact-head source capsule
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force receipts | Out-Null
          git archive --format=zip --prefix=uvmgr/ --output=uvmgr-source.zip HEAD
          (Get-FileHash uvmgr-source.zip -Algorithm SHA256).Hash.ToLower() |
            Set-Content receipts/source-capsule.sha256
          git rev-parse HEAD | Set-Content receipts/head.sha
          git rev-parse 'HEAD^{tree}' | Set-Content receipts/tree.sha

      - uses: actions/upload-artifact@v6
        with:
          name: uvmgr-source-capsule-windows
          path: |
            uvmgr-source.zip
            receipts/
          if-no-files-found: error
          retention-days: 3

  validate-and-capsule:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Install exact lock closure
        run: uv sync --all-extras --group dev --group ci

      - name: Compile changed Python surfaces
        run: |
          uv run python -m compileall -q \
            src/uvmgr/cli.py \
            src/uvmgr/commands/__init__.py \
            src/uvmgr/commands/tests.py \
            src/uvmgr/commands/capabilities.py \
            src/uvmgr/core/capabilities.py \
            src/uvmgr/ops/tests.py \
            src/uvmgr/runtime/tests.py \
            tests/test_tests_execution.py

      - name: Lint changed Python surfaces
        run: |
          uv run ruff check \
            src/uvmgr/cli.py \
            src/uvmgr/commands/__init__.py \
            src/uvmgr/commands/tests.py \
            src/uvmgr/commands/capabilities.py \
            src/uvmgr/core/capabilities.py \
            src/uvmgr/ops/tests.py \
            src/uvmgr/runtime/tests.py \
            tests/test_tests_execution.py

      - name: Execute receipt boundary tests
        run: uv run pytest tests/test_tests_execution.py -v --tb=short

      - name: Replay exact formerly failing dogfood invocation
        run: uv run uvmgr tests run tests/test_tests_execution.py -v --tb=short --no-parallel --no-coverage

      - name: Verify admitted capability imports
        run: uv run uvmgr capabilities verify

      - name: Manufacture exact-head source and receipt capsule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts reports/receipts
          git archive --format=tar.gz --prefix=uvmgr/ --output=uvmgr-source.tar.gz HEAD
          sha256sum uvmgr-source.tar.gz | tee receipts/source-capsule.sha256
          git rev-parse HEAD | tee receipts/head.sha
          git rev-parse HEAD^{tree} | tee receipts/tree.sha
          find reports/receipts -type f -maxdepth 1 -print -exec sha256sum {} \; \
            | tee receipts/execution-receipts.sha256

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: uvmgr-errc-validation-capsule
          path: |
            uvmgr-source.tar.gz
            receipts/
            reports/receipts/
          if-no-files-found: error
          retention-days: 3
