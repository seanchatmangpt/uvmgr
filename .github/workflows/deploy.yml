name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: Non-production publication channel
        required: true
        type: choice
        default: development
        options:
          - development
          - test
          - acceptance

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Admit production tag or bounded non-production channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            case "${{ inputs.environment }}" in
              development|test|acceptance) ;;
              *) exit 64 ;;
            esac
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Admit exact audit closure
        run: uv sync --frozen --group ci

      - name: Validate lock
        run: uv lock --check

      - name: Verify enterprise repository contract
        run: uv run python -m uvmgr.core.enterprise_contract

      - name: Audit locked dependencies
        run: uv run pip-audit

  container:
    name: Publish immutable container
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.environment }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build, attest, and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Manufacture release receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          printf '%s\n' "${GITHUB_SHA}" > receipts/source.sha
          printf '%s\n' "${{ steps.build.outputs.digest }}" > receipts/image.digest
          printf '%s\n' "${{ github.ref }}" > receipts/source.ref
          printf '%s\n' "${{ github.event_name == 'push' && 'production' || inputs.environment }}" > receipts/environment
          sha256sum receipts/* | sort > receipts/manifest.sha256

      - name: Upload release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-${{ github.sha }}
          path: receipts/
          if-no-files-found: error
