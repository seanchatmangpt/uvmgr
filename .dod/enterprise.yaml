name: "Enterprise Definition of Done"
version: "2.0.0"
enforcement: "evidence"

standing_model:
  - "UNKNOWN"
  - "PARTIAL_ALIVE"
  - "ALIVE"
  - "BLOCKED"
  - "BUILD_BROKEN"
  - "UNSUPPORTED"
  - "REFUSED"

principles:
  - "zero_unreceipted_actuation"
  - "exact_subject_execution"
  - "inspection_is_not_execution"
  - "policy_and_evidence_are_separate"
  - "external_controls_are_never_fabricated"
  - "production_publication_requires_immutable_identity"

control_plane:
  repository_contract: "enterprise/controls.json"
  verifier: "python -m uvmgr.core.enterprise_contract"
  ci_workflow: ".github/workflows/ci.yml"
  release_workflow: ".github/workflows/deploy.yml"

controls:
  source_integrity:
    - id: "EA-SRC-001"
      requirement: "The lockfile is frozen and checked before admitted execution."
      evidence: "CI Validate admitted source"
    - id: "EA-SRC-002"
      requirement: "Third-party GitHub Actions are pinned to immutable commit SHAs."
      evidence: "enterprise contract verifier"

  execution:
    - id: "EA-EXE-001"
      requirement: "Commands preserve Commands -> Ops -> Runtime actuation boundaries."
      evidence: "capability registry, tests, and execution receipts"
    - id: "EA-EXE-002"
      requirement: "CI validation is non-mutating."
      evidence: "CI workflow and enterprise contract verifier"

  packaging:
    - id: "EA-PKG-001"
      requirement: "Standalone executable manufacture is fail-closed and dogfooded."
      evidence: "CI Dogfood executable"
    - id: "EA-PKG-002"
      requirement: "Container runtime is non-root and excludes the build toolchain."
      evidence: "CI Hardened container"

  release:
    - id: "EA-REL-001"
      requirement: "Production publication is admitted only from a semantic-version tag."
      evidence: "Release Verify release subject"
    - id: "EA-REL-002"
      requirement: "Published images carry immutable SHA tags, SBOM, provenance, and digest receipts."
      evidence: "Release Publish immutable container"
    - id: "EA-REL-003"
      requirement: "Locked dependencies are audited before publication."
      evidence: "Release Verify release subject"

  governance:
    - id: "EA-GOV-001"
      requirement: "Repository-observable controls are executable and fail closed."
      evidence: "enterprise/controls.json and uvmgr.core.enterprise_contract"
    - id: "EA-GOV-002"
      requirement: "Platform controls remain explicitly external until observed."
      evidence: "enterprise contract verifier REFUSED:EXTERNAL_CONTROL output"

external_controls:
  - id: "EA-EXT-001"
    requirement: "main branch protection and required status checks"
    standing: "REQUIRED_EXTERNAL"
  - id: "EA-EXT-002"
    requirement: "production environment approvers and deployment protection rules"
    standing: "REQUIRED_EXTERNAL"
  - id: "EA-EXT-003"
    requirement: "private vulnerability reporting and enterprise incident routing"
    standing: "REQUIRED_EXTERNAL"
  - id: "EA-EXT-004"
    requirement: "commercial support, indemnity, and customer licensing terms"
    standing: "REQUIRED_EXTERNAL"

prohibited:
  - "self_mutating_ci"
  - "auto_tuned_governance_thresholds"
  - "ambient_production_authority"
  - "mutable_third_party_action_refs"
  - "build_toolchain_in_runtime_image"
  - "unreceipted_release_promotion"
